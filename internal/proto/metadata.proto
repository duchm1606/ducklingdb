syntax = "proto3";

package ducklingdb.proto;

option go_package = "github.com/duchm1606/ducklingdb/internal/proto";

// NodeDescriptor describes a single DucklingDB node. Gossiped to all
// nodes so every member knows how to reach every other member.
message NodeDescriptor {
  int32 node_id = 1;
  string address = 2;              // "host:port"
  map<string, string> attrs = 3;   // locality labels, custom tags
}

// StoreCapacity summarizes a store's resource usage. Gossiped
// periodically for the allocator (M4) to make placement decisions.
message StoreCapacity {
  int64 total_bytes = 1;
  int64 used_bytes = 2;
  int32 range_count = 3;
}

// StoreDescriptor describes a single store (one engine instance).
// Each node has exactly one store in DucklingDB.
message StoreDescriptor {
  int32 store_id = 1;
  int32 node_id = 2;
  StoreCapacity capacity = 3;
}
