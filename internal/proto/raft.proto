syntax = "proto3";

package ducklingdb.proto;

option go_package = "github.com/duchm1606/ducklingdb/internal/proto";

// RaftEntry is one entry in the Raft log, carried over the wire.
message RaftEntry {
  uint64 term  = 1;
  uint64 index = 2;
  bytes  data  = 3;
}

// RaftSnapshotMetadata pins a snapshot to a specific log position.
message RaftSnapshotMetadata {
  uint64 index = 1; // last log index covered by this snapshot
  uint64 term  = 2; // term of that entry
}

// RaftSnapshot is a state-machine snapshot transported on MsgSnap.
message RaftSnapshot {
  RaftSnapshotMetadata metadata = 1;
  bytes data = 2;
}

// RaftMessage is a Raft protocol message sent between replicas.
message RaftMessage {
  uint64 range_id    = 1;
  uint64 from        = 2;
  uint64 to          = 3;
  uint64 term        = 4;
  uint64 log_term    = 5;  // prevLogTerm (MsgApp) or candidate last log term (MsgVote)
  uint64 index       = 6;  // prevLogIndex (MsgApp) or matchIndex (MsgAppResp)
  uint64 commit      = 7;  // leaderCommit
  uint32 type        = 8;  // raft.MessageType cast to uint32
  bool   reject      = 9;
  uint64 reject_hint = 10; // follower's last log index for fast nextIndex backtrack
  repeated RaftEntry entries = 11;
  RaftSnapshot snapshot = 12; // populated for MsgSnap
}

// RaftMessageResponse is the empty acknowledgement from Step RPC.
message RaftMessageResponse {}
