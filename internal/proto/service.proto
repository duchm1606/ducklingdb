syntax = "proto3";

package ducklingdb.proto;

option go_package = "github.com/duchm1606/ducklingdb/internal/proto";

import "internal/proto/api.proto";
import "internal/proto/data.proto";

// Internal is the node-to-node RPC service. Every DucklingDB node
// exposes this service on its gRPC port. It handles both KV operations
// (via Batch) and heartbeating (via Heartbeat).
service Internal {
  // Batch executes a bundle of KV operations on the receiving node.
  rpc Batch(BatchRequest) returns (BatchResponse) {}

  // Heartbeat is a lightweight ping/pong used for liveness detection
  // and clock offset measurement between peers.
  rpc Heartbeat(PingRequest) returns (PingResponse) {}

  // AllocateNodeID is called by a joining node to obtain a unique NodeID
  // and learn the cluster's identity. Only bootstrap nodes handle this.
  rpc AllocateNodeID(AllocateNodeIDRequest) returns (AllocateNodeIDResponse) {}
}

// AllocateNodeIDRequest is sent by a node that wants to join the cluster.
message AllocateNodeIDRequest {}

// AllocateNodeIDResponse carries the assigned NodeID and the cluster's UUID.
message AllocateNodeIDResponse {
  int32 node_id = 1;
  bytes cluster_id = 2;  // 16-byte cluster UUID
}

// PingRequest carries the sender's identity and current HLC timestamp.
// The receiver uses the timestamp to measure clock offset.
message PingRequest {
  int32 node_id = 1;
  Timestamp server_time = 2;
}

// PingResponse carries the responder's identity and current HLC
// timestamp back to the caller.
message PingResponse {
  int32 node_id = 1;
  Timestamp server_time = 2;
}

// --- Gossip messages ---

// Info is a single piece of gossip data identified by a string key.
message Info {
  string key = 1;
  bytes value = 2;
  int64 orig_stamp = 3;   // monotonic sequence number from the originating node
  int32 node_id = 4;      // which node created this info
  int64 ttl_seconds = 5;  // time-to-live in seconds (0 = no expiry)
}

// GossipMessage is exchanged bidirectionally on a Gossip stream.
// Each side sends its delta (items the peer hasn't seen) and its
// current high-water stamps so the peer can compute the next delta.
message GossipMessage {
  int32 node_id = 1;
  string addr = 2;
  map<string, Info> delta = 3;       // key → info (only fresh items)
  map<int32, int64> high_water = 4;  // nodeID → highest seq seen from that node
}

// GossipService is the gossip RPC service. Each node acts as both
// client and server: it connects to peers (client side) and accepts
// incoming connections from peers (server side).
service GossipService {
  // Gossip is a long-lived bidirectional stream. Each round, both sides
  // send a GossipMessage containing their delta and high-water stamps.
  rpc Gossip(stream GossipMessage) returns (stream GossipMessage) {}
}
