syntax = "proto3";

package ducklingdb.proto;

option go_package = "github.com/duchm1606/ducklingdb/internal/proto";

// Timestamp mirrors hlc.Timestamp — a hybrid logical clock value
// with a wall-clock component (nanoseconds) and a logical counter.
message Timestamp {
  int64 wall_time = 1;
  int32 logical = 2;
}

// TxnMeta is the wire representation of a transaction's identity and
// current state. It carries enough information for a remote node to
// participate in conflict resolution without a round-trip to the
// transaction record.
message TxnMeta {
  bytes id = 1;                     // 16-byte TxnID
  int32 status = 2;                 // 0=PENDING, 1=COMMITTED, 2=ABORTED
  int32 isolation = 3;              // 0=SSI, 1=SI
  Timestamp read_timestamp = 4;
  Timestamp write_timestamp = 5;
  Timestamp max_timestamp = 6;
  int32 priority = 7;
}

// Value wraps raw bytes with an optional timestamp, used in
// KV responses to return both the data and its version.
message Value {
  bytes raw_bytes = 1;
  Timestamp timestamp = 2;
}

// KeyValue is a single key-value pair returned by Scan operations.
message KeyValue {
  bytes key = 1;
  Value value = 2;
}

// Error carries a structured error from the server back to the client.
// For now it's a simple string; future milestones may add typed error
// variants (WriteIntentError, WriteTooOldError, etc.).
message Error {
  string message = 1;
}
